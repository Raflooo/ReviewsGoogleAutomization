name: Revisar reseñas nuevas

on:
  schedule:
    # Corre cada 1 hora.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde GitHub

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegadores de Playwright
        run: playwright install --with-deps chromium

      - name: Correr el análisis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Guardar capturas de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captura-diagnostico
          path: |
            debug_screenshot.png
            debug_screenshot_2_scroll.png
          if-no-files-found: ignore
